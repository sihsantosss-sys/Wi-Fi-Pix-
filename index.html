<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Access - Pagamento Pix</title>
    <style>
        :root {
            --primary-color: #009ee3;
            --primary-hover: #007eb5;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #222;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #qr-container {
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        #qr-code {
            max-width: 200px;
            height: auto;
            margin: 15px auto;
            display: block;
            border: 4px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 6px;
        }

        .pix-copy-paste {
            background: #f8f9fa;
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 10px;
            color: #555;
            text-align: left;
        }

        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
            font-size: 0.9rem;
            padding: 10px;
        }

        .copy-btn:hover {
            background-color: #218838;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wi-Fi Liberado</h1>
        <p class="subtitle">Pague com Pix para obter acesso imediato à internet.</p>

        <form id="payment-form">
            <div class="form-group">
                <label for="plano">Selecione o Plano:</label>
                <select id="plano" required>
                    <option value="2.00">1 Hora de Acesso - R$ 2,00</option>
                    <option value="5.00" selected>1 Dia de Acesso - R$ 5,00</option>
                    <option value="15.00">7 Dias de Acesso - R$ 15,00</option>
                </select>
            </div>

            <div class="form-group">
                <label for="whatsapp">Número de WhatsApp / Telefone:</label>
                <input type="tel" id="whatsapp" placeholder="(33) 99999-9999" required>
            </div>

            <button type="submit" id="btn-submit">Gerar Pix de Pagamento</button>
        </form>

        <div id="qr-container">
            <h3>Escaneie o QR Code</h3>
            <img id="qr-code" src="" alt="QR Code Pix">
            <p style="font-size: 0.85rem; color: #666; margin-top: 10px;">Ou copie o código Pix abaixo:</p>
            <div class="pix-copy-paste" id="pix-copia-cola"></div>
            <button class="copy-btn" id="btn-copy" onclick="copiarCodigo()">Copiar Código Pix</button>
        </div>
    </div>

    <script>
        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const valor = document.getElementById('plano').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const btn = document.getElementById('btn-submit');
            
            btn.textContent = "A gerar Pix...";
            btn.disabled = true;

            try {
                const response = await fetch('/criar-pix', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ valor, whatsapp })
                });

                const data = await response.json();

                if (response.ok && data.qr_code_base64) {
                    // Exibe o QR code em Base64 e o copia-e-cola
                    document.getElementById('qr-code').src = `data:image/png;base64,${data.qr_code_base64}`;
                    document.getElementById('pix-copia-cola').innerText = data.copia_e_cola;
                    document.getElementById('qr-container').style.display = 'block';
                    btn.textContent = "Pix Gerado com Sucesso!";
                } else {
                    alert('Erro ao gerar Pix: ' + (data.error || 'Tente novamente.'));
                    btn.textContent = "Gerar Pix de Pagamento";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor.');
                btn.textContent = "Gerar Pix de Pagamento";
                btn.disabled = false;
            }
        });

        function copiarCodigo() {
            const texto = document.getElementById('pix-copia-cola').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert('Código Pix copiado com sucesso!');
            });
        }
    </script>
</body>
</html>
